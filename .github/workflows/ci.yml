name: Foundation checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies for high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-security-headers.mjs
      - run: node scripts/verify-exercise-assets.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke

  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify live Cloudflare site, assets, and deployed commit
        env:
          GYM_OS_EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/verify-production.mjs
